name: Voice editor security regressions
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  voice-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --only-binary=:all: -r requirements-voice.txt httpx pytest
      - run: python -m pytest tests/test_voice_edit_security.py -q
      - run: bash -n voice_edit_setup.sh && zsh -n tts_sync.sh
